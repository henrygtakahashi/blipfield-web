<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kodo</title>
  <meta name="description" content="Kodo: Bluetooth Signal Hunt. See every Bluetooth device nearby and follow its signal to find it.">
  <link rel="icon" href="icon.png">
  <style>
    :root { --bg: #121418; --text: #d5d8dd; --text-2: #abb0b7; --signal: #ffb224; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #fbfaf7; --text: #1d1b17; --text-2: #4a463e; --signal: #8a5a00; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 480px; padding: 48px 16px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { margin: 16px 0 4px; font-size: 30px; }
    p { color: var(--text-2); margin: 0 0 24px; }
    a { color: var(--signal); }
  </style>
</head>
<body>
<main>
  <img src="icon.png" alt="Kodo icon">
  <h1>Kodo</h1>
  <p>See every Bluetooth device nearby, then follow its signal to find it. Passive only: nothing leaves your phone.</p>
  <a href="privacy">Privacy policy</a>
</main>
</body>
</html>
